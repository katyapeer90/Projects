# Prep values for CET-app-helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

#global vars for an environment , probably will be different between environemnts
global:
  #Environment variables that used in many services but might require an override in specific services
  ASPNETCORE_ENVIRONMENT: Testing
  DOMAIN_ENVIRONMENT_TESTING: 
  CLIENT_ENVIRONMENT_TESTING: 
  VALUE_ENVIRONMENT_TESTING: 
  AzureKeyVaultUri: 
  AzureKeyVaultTenantId: 
  AzureKeyVaultClientId: 
  AzureKeyVaultClientSecret: 
  CORALOGIX_LOG_URL: https://
  TMPDIR: /app-ram/tmp
  DOTNET_CLI_HOME: /app-ram/dotnet-temp
  ASPNETCORE_TEMP : /app-ram/aspnet-temp
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_USE_POLLING_FILE_WATCHER: "true"
  #docker registry
  acrUrl: 
  # serviceAccountName that used in many services but might require an override in the future
  # Enabling and configuring scale up/down jobs for the cluster
  # This jobs set the replicas for all deployment to 0 and the specified time
  # and back to 1 at the specified up time
  #scaleUpJobEnabled: false
  #scaleDownJobEnabled: false
  #scaleUpJobSchedule: "30 6 * * 0-4"
  #scaleDownJobSchedule: "0 19 * * 0-4"
  #Default node selector for all apps
  nodeSelector:
    kubernetes.io/os: linux
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: aks-qa
  spec:
    replicas: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
    metrics:
      memoryaverageValue: 1200Mi
      cpuaverageUtilization: 70
  #default resources for pods
  resources:
    limitscpu: 200m
    limitsmemory: 1000Mi
    requestscpu: 10m
    requestsmemory: 500Mi
  livenessProbe:
    path: version.json
    port: 80
    scheme: HTTP
    initialDelaySeconds: 15
    timeoutSeconds: 2
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readinessProbe:
    path: version.json
    port: 80
    scheme: HTTP
    initialDelaySeconds: 15
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  ports:
    containerPort: 80
serviceEnable:
  #app services
  accessmngapi: true
  accountservices: true
  accountservicesapi: true
  learning: true
  learning-collaboration: true
  servicebusmetrics: true
  treeservice: true
services:
  #this is an example fo the foramt of adding a service , all other services should follow the same template
  #so the helper functions can handle them
  #app_user_audit_log_service:
  #should this service and its related object be deployed
  #enable: false

  #name of the service , this will be used a base name for the objects creater by the helper functions for this service
  #name: svc_dbapp-user-audit-log
  #this export environemnt vars to the deployment from a list of config maps
  #no need to pass this key if not using it, it is designed to remove clutter form the 
  #values file by grouping service specific env vars into a configmap
  # envsFromConfigMap: []

  #env vars that will be loaded from secrets mathcing the names in the list

  #env vars from global to use , if you want to override them remove the seelcted
  #var from the list and add it in envVars

  #list of env vars with specific values for this service

  accessmngapi:
    ramdisk:
      enabled: true
      volumeName: unified-ramdisk
      mountPath: /app-ram
      sizeLimit: 100Mi
      command: ["/bin/sh"]
      args: ["-c", "mkdir -p /app-ram/tmp /app-ram/aspnet-temp /app-ram/dotnet-temp && cp -r /app/* /app-ram/ && cd /app-ram && dotnet CET.AccessManagementServices.dll"]
    envVarsFromGlobal: [DOMAIN_ENVIRONMENT_TESTING, CLIENT_ENVIRONMENT_TESTING, VALUE_ENVIRONMENT_TESTING, ASPNETCORE_ENVIRONMENT, CORALOGIX_LOG_URL, TMPDIR, DOTNET_CLI_HOME, ASPNETCORE_TEMP, DOTNET_SYSTEM_GLOBALIZATION_INVARIANT, DOTNET_RUNNING_IN_CONTAINER, DOTNET_USE_POLLING_FILE_WATCHER]
    envVars:
      GlobalConfiguration__BaseUrl: "http://accessmngapi.testing"
    nodeSelector: []
    ports: []
    resources: []
    hostAliases:
      - ip: 
        hostnames: []
      - ip: 
        hostnames: []
      - ip: 
        hostnames: []
      - ip: 
        hostnames: []
  accountservices:
    ramdisk:
      enabled: true
      volumeName: unified-ramdisk
      mountPath: /app-ram
      sizeLimit: 25Mi
      command: ["/bin/sh"]
      args: ["-c", "mkdir -p /app-ram/tmp /app-ram/aspnet-temp /app-ram/dotnet-temp && cp -r /app/* /app-ram/ && cd /app-ram && dotnet AccountServices.Client.dll"]
    envVarsFromGlobal: [DOMAIN_ENVIRONMENT_TESTING, CLIENT_ENVIRONMENT_TESTING, VALUE_ENVIRONMENT_TESTING, ASPNETCORE_ENVIRONMENT, CORALOGIX_LOG_URL, TMPDIR, DOTNET_CLI_HOME, ASPNETCORE_TEMP, DOTNET_SYSTEM_GLOBALIZATION_INVARIANT, DOTNET_RUNNING_IN_CONTAINER, DOTNET_USE_POLLING_FILE_WATCHER]
    envVars:
      GlobalConfiguration__BaseUrl: "http://accountservices.testing"
    nodeSelector: []
    ports: []
    resources: []
    hostAliases:
      - ip: 
        hostnames: []
  accountservicesapi:
    ramdisk:
      enabled: true
      volumeName: unified-ramdisk
      mountPath: /app-ram
      sizeLimit: 25Mi
      command: ["/bin/sh"]
      args: ["-c", "mkdir -p /app-ram/tmp /app-ram/aspnet-temp /app-ram/dotnet-temp && cp -r /app/* /app-ram/ && cd /app-ram && dotnet AccountServices.Api.dll"]
    envVarsFromGlobal: [DOMAIN_ENVIRONMENT_TESTING, CLIENT_ENVIRONMENT_TESTING, VALUE_ENVIRONMENT_TESTING, ASPNETCORE_ENVIRONMENT, CORALOGIX_LOG_URL, TMPDIR, DOTNET_CLI_HOME, ASPNETCORE_TEMP, DOTNET_SYSTEM_GLOBALIZATION_INVARIANT, DOTNET_RUNNING_IN_CONTAINER, DOTNET_USE_POLLING_FILE_WATCHER]
    envVars:
      GlobalConfiguration__BaseUrl: "http://accountservicesapi.testing"
    nodeSelector: []
    ports: []
    resources: []
    hostAliases:
      - ip: 
        hostnames: []
  learning:
    ramdisk:
      enabled: true
      volumeName: unified-ramdisk
      mountPath: /app-ram
      sizeLimit: 350Mi
      command: ["/bin/sh"]
      args: ["-c", "mkdir -p /app-ram/tmp /app-ram/node-temp /app-ram/app && cp -r /app/standalone/* /app-ram/app/ && cd /app-ram/app && npx migrate-mongo up && node packages/hendrx/server.js"]
    ports:
      containerPort: 4200
    envVars:
      CORALOGIX_URL: https://api.eu2.coralogix.com:443/api/v1/logs
      CORALOGIX_API_KEY: 
      NEXT_PUBLIC_MODULE_CATALOG: cet
      TMPDIR: /app-ram/tmp
      NODE_TMPDIR: /app-ram/node-temp
      NODE_ENV: production
      MONGODB_CONNECTION_STRING: 
      MONGODB_DATABASE: hendrx-learning
      PORT: 4200
      CLOUDINARY_NAME: 
      CLOUDINARY_API_KEY: ''
      CLOUDINARY_API_SECRET: 
      JWT_SECRET: JWT_SECRET
      TEST_SCHOOL_IDS: 
      GOOGLE_AUTH_CLIENT_SECRET: 
      TEMPLATE_MANAGERS_EMAILS: 
      TEMPLATE_CREATORS_EMAILS: 
      ADMIN_EMAILS: hendrxplayer@gmail.com
      STUDENT_EMAILS: hendrxstudent@gmail.com
      DOMAIN: testing
      CORS_ORIGIN: 
      BASE_URL_PROD: https://learning.testing
      NEXT_PUBLIC_WS_URL: wss://learning-collaboration.testing
      COLLABORATION_WS_URL_PROD: wss://learning-collaboration.testing
      LOGGER_URL: http://logsserver
      APP_NAME: Hendrx
      CERT_NAME: collaboration-sert
      GTM_TAG: GTM-K5FGNZ42
      GlobalConfiguration__BaseUrl: http://learning.testing
      REDIS_HOST: 
      REDIS_PORT: '6379'
      AzureKeyVaultUri: 
      AzureKeyVaultTenantId: 
      AzureKeyVaultClientId: 
      AzureKeyVaultClientSecret: 
    nodeSelector: []
    resources:
      limitscpu: 750m
      limitsmemory: 1000Mi
      requestscpu: 500m
      requestsmemory: 500Mi
    hostAliases:
      - ip: 
        hostnames: [learning-collaboration.testing]
      - ip: 
        hostnames: []
      - ip: 
        hostnames: [redistest]
      - ip: 
        hostnames: [bdevmongo]
  learning-collaboration:
    ramdisk:
      enabled: true
      volumeName: unified-ramdisk
      mountPath: /app-ram
      sizeLimit: 2Gi
      command: ["/bin/sh"]
      args: ["-c", "mkdir -p /app-ram/tmp /app-ram/node-temp /app-ram/app && cp -r /app/node_modules /app-ram/app/ && cp -r /app/dist /app-ram/app/ && cp -r /app/translations /app-ram/app/ && cd /app-ram/app && node dist/packages/collaboration/main.js"]
