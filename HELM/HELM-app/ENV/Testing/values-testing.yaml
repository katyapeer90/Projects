      NEXT_PUBLIC_MODULE_CATALOG: cet
      TMPDIR: /app-ram/tmp
      NODE_TMPDIR: /app-ram/node-temp
      NODE_ENV: production
      MONGODB_CONNECTION_STRING: 
      MONGODB_DATABASE: hendrx-learning
      HOST: learning-collaboration.testing
      PORT: '3000'
      JWT_SECRET: JWT_SECRET
      GOOGLE_AUTH_CLIENT_SECRET: 
      TEMPLATE_MANAGERS_EMAILS: 
      TEMPLATE_CREATORS_EMAILS: 
      ADMIN_EMAILS: hendrxplayer@gmail.com
      STUDENT_EMAILS: hendrxstudent@gmail.com
      DOMAIN: testing
      CORS_ORIGIN: 
      BASE_URL_PROD: https://learning.testing
      NEXT_PUBLIC_WS_URL: wss://learning-collaboration.testing
      COLLABORATION_WS_URL_PROD: wss://learning-collaboration.testing
      LOGGER_URL: http://logsserver.azure:5341
      APP_NAME: Hendrx
      CERT_NAME: collaboration-wild
      GlobalConfiguration__BaseUrl: http://learning-collaboration.testing
      REDIS_HOST: 
      REDIS_PORT: '6379'
      AzureKeyVaultUri: 
      AzureKeyVaultTenantId: 
      AzureKeyVaultClientId: 
      AzureKeyVaultClientSecret: 
    nodeSelector: []
    resources:
      limitscpu: 750m
      limitsmemory: 4000Mi
      requestscpu: 500m
      requestsmemory: 2500Mi
    isTcpSocket: true
    hostAliases:
      - ip: 
        hostnames: [learning.testing]
      - ip: 
        hostnames: []  
  servicebusmetrics:
    ports:
      containerPort: 443
    envVars:
      AzureKeyVaultUri: 
      AzureKeyVaultTenantId: 
      AzureKeyVaultClientId: 
      AzureKeyVaultClientSecret: 
      ASPNETCORE_ENVIRONMENT: Testing
    nodeSelector: []
    resources: []
    isTcpSocket: true
  treeservice:
    ramdisk:
      enabled: true
      volumeName: unified-ramdisk
      mountPath: /app-ram
      sizeLimit: 55Mi
      command: ["/bin/sh"]
      args: ["-c", "mkdir -p /app-ram/tmp /app-ram/aspnet-temp /app-ram/dotnet-temp && cp -r /app/* /app-ram/ && cd /app-ram && dotnet TreeService.dll"]
    envVarsFromGlobal: [DOMAIN_ENVIRONMENT_TESTING, CLIENT_ENVIRONMENT_TESTING, VALUE_ENVIRONMENT_TESTING, ASPNETCORE_ENVIRONMENT, CORALOGIX_LOG_URL, TMPDIR, DOTNET_CLI_HOME, ASPNETCORE_TEMP, DOTNET_SYSTEM_GLOBALIZATION_INVARIANT, DOTNET_RUNNING_IN_CONTAINER, DOTNET_USE_POLLING_FILE_WATCHER]
    envVars:
      GlobalConfiguration__BaseUrl: "http://treeservice.testing"
    nodeSelector: []
    ports: []
    resources: []
    hostAliases:
      - ip: 
        hostnames: [, ]
      - ip: 
        hostnames: []
